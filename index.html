<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledgerlands</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A point-and-click market-town RPG where you level six money skills.">
<meta name="theme-color" content="#101820">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23e4c27a'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%235a4018' stroke-width='1.4'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-family='Georgia' font-size='14' fill='%235a4018'%3EL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700;800&family=VT323&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div id="frame">
    <section id="world" aria-label="Game world">
      <canvas id="view"></canvas>

      <div id="tracker" hidden>
        <button id="trk-main" title="Walk there">
          <span class="trk-k">Next step</span>
          <span id="trk-title"></span>
          <span id="trk-text"></span>
        </button>
        <button id="trk-hide" class="icon-btn sm" aria-label="Hide the next-step card" title="Hide">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10"/></svg>
        </button>
      </div>
      <button id="trk-show" class="hud-chip" hidden>Show next step</button>

      <div id="clock">
        <div class="clock-row"><span id="clock-sky" aria-hidden="true"></span><span id="clock-month">Month 1</span><span id="clock-year">Year 1</span></div>
        <div class="bar"><i id="clock-fill"></i></div>
        <div class="clock-btns">
          <button id="btn-pause" class="icon-btn" title="Pause the clock (P)" aria-label="Pause the clock">
            <svg class="i-pause" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5v10M13 5v10"/></svg>
            <svg class="i-play" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5l8 5-8 5z"/></svg>
          </button>
          <span id="clock-state">Next month-end</span>
          <button id="btn-map" class="icon-btn" title="World map (M)" aria-label="Open the world map">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5l4-2 6 2 4-2v12l-4 2-6-2-4 2zM7 3v12M13 5v12"/></svg>
          </button>
        </div>
      </div>

      <div id="tip" hidden></div>
      <div id="drops"></div>
      <div id="toasts" aria-live="polite"></div>
      <div id="banner" hidden></div>
      <div id="ctx" hidden></div>
      <div id="scrim" hidden></div>
      <div id="win" hidden role="dialog" aria-labelledby="win-title">
        <header><h2 id="win-title"></h2><button id="win-close" class="icon-btn" aria-label="Close window"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button></header>
        <div id="win-body"></div>
      </div>

      <div id="dock">
        <div id="chatbox">
          <div class="chat-head">
            <div class="chat-tabs" role="tablist" aria-label="Filter messages">
              <button role="tab" data-f="all" aria-selected="true">All</button>
              <button role="tab" data-f="money" aria-selected="false">Money</button>
              <button role="tab" data-f="lesson" aria-selected="false">Lessons</button>
            </div>
            <button id="chat-toggle" class="icon-btn sm" aria-label="Collapse messages" aria-expanded="true"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 8l5 5 5-5"/></svg></button>
          </div>
          <div id="chat" role="log" data-f="all"></div>
        </div>
        <div id="dialog" hidden>
          <canvas id="portrait" width="160" height="160"></canvas>
          <div class="dlg-main">
            <div class="dlg-head"><span id="dlg-name"></span><span id="dlg-role"></span></div>
            <p id="dlg-text"></p>
            <div id="dlg-opts"></div>
          </div>
        </div>
      </div>
    </section>

    <aside id="side" aria-label="Character panel">
      <div class="brand"><h1>Ledgerlands</h1><span id="who"></span></div>
      <div class="mini-wrap">
        <canvas id="mini" width="224" height="160" aria-label="Minimap. Click to walk there."></canvas>
        <button id="mini-expand" class="icon-btn sm" title="World map (M)" aria-label="Open the world map"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 8V4h4M16 8V4h-4M4 12v4h4M16 12v4h-4"/></svg></button>
      </div>
      <div id="orbs">
        <div class="orb" title="Coins you carry. Spent first on rent and bills."><span>Purse</span><b id="o-purse">0</b></div>
        <div class="orb" title="Savings at the Bank of Thrift. Earns interest at each month-end."><span>Bank</span><b id="o-bank">0</b></div>
        <div class="orb" title="Everything you own (purse, savings, investments) minus what you owe."><span>Net worth</span><b id="o-net">0</b></div>
        <div class="orb" title="300 to 850. On-time payments raise it, missed bills lower it."><span>Credit</span><b id="o-credit">650</b></div>
      </div>
      <nav id="tabs" role="tablist" aria-label="Panel">
        <button role="tab" data-tab="skills" aria-selected="true" title="Skills (K)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16v-5M10 16V5M16 16V8"/></svg><span>Skills</span></button>
        <button role="tab" data-tab="pack" aria-selected="false" title="Pack (I)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 7.5h11l1 9h-13zM7.5 7.5V6a2.5 2.5 0 015 0v1.5"/></svg><span>Pack</span></button>
        <button role="tab" data-tab="quests" aria-selected="false" title="Quests (Q)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 3.5h9v11a2 2 0 01-2 2H5.5a2 2 0 01-2-2V14h9.5M6 3.5a2 2 0 00-2 2V14M8 7h4M8 10h4"/></svg><span>Quests</span></button>
        <button role="tab" data-tab="ledger" aria-selected="false" title="Ledger (L)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4h9a3 3 0 013 3v9.5H7a3 3 0 01-3-3zM4 13.5a3 3 0 013-3h9"/></svg><span>Ledger</span></button>
        <button role="tab" data-tab="journal" aria-selected="false" title="Journal (J)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 3.5C9.5 3.5 5 8.5 5 16.5M16.5 3.5c0 6-4 10.5-11 12.5M9 11h4"/></svg><span>Journal</span></button>
        <button role="tab" data-tab="settings" aria-selected="false" title="Settings"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.8"/><path d="M10 2.5v2.5M10 15v2.5M2.5 10H5M15 10h2.5M4.7 4.7l1.8 1.8M13.5 13.5l1.8 1.8M4.7 15.3l1.8-1.8M13.5 6.5l1.8-1.8"/></svg><span>Settings</span></button>
      </nav>
      <div id="tab-body" role="tabpanel"></div>
    </aside>
  </div>

  <div id="title" hidden>
    <div class="title-card" id="title-main">
      <div class="crest" aria-hidden="true"><span>L</span></div>
      <div class="logo">Ledgerlands</div>
      <p class="tagline">Earn it. Save it. Grow it. A market-town adventure about money.</p>
      <div class="title-btns">
        <button id="t-continue" class="pbtn big primary" hidden>Continue</button>
        <button id="t-new" class="pbtn big">New game</button>
      </div>
      <p class="small" id="t-saveinfo"></p>
    </div>
    <div class="title-card creator" id="title-create" hidden>
      <h2>Create your townsperson</h2>
      <div class="creator-grid">
        <canvas id="c-preview" width="200" height="240" aria-label="Character preview"></canvas>
        <div class="creator-form">
          <label for="c-name">Name</label>
          <input id="c-name" maxlength="14" autocomplete="off" spellcheck="false" value="Traveler">
          <div class="sw-row"><span>Shirt</span><div class="swatches" data-k="shirt"></div></div>
          <div class="sw-row"><span>Hair</span><div class="swatches" data-k="hair"></div></div>
          <div class="sw-row"><span>Skin</span><div class="swatches" data-k="skin"></div></div>
          <fieldset class="pace">
            <legend>Pace · how long a month lasts</legend>
            <label><input type="radio" name="pace" value="60"> Relaxed <small>60 s</small></label>
            <label><input type="radio" name="pace" value="40" checked> Standard <small>40 s</small></label>
            <label><input type="radio" name="pace" value="25"> Brisk <small>25 s</small></label>
          </fieldset>
        </div>
      </div>
      <div class="title-btns">
        <button id="c-back" class="pbtn">Back</button>
        <button id="c-begin" class="pbtn big primary">Begin</button>
      </div>
    </div>
  </div>
</div>
<script src="src/data.js"></script>
<script src="src/game.js"></script>
</body>
</html>
